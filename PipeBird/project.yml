# XcodeGen project spec for the PipeBird iOS app (Phase B+).
# UNVERIFIED — generated/built only on macOS:  brew install xcodegen && xcodegen generate
# Defines the app target declaratively so the .xcodeproj is reviewable as code, not a hand-written
# pbxproj. The app depends on the verified PipeBirdCore SwiftPM package (../PipeBirdCore).
name: PipeBird
options:
  bundleIdPrefix: ai.settlegrid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PipeBirdCore:
    path: ../PipeBirdCore

targets:
  PipeBird:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        # Info.plist is referenced via settings below, not compiled as a resource.
        excludes:
          - "Info.plist"
    dependencies:
      - package: PipeBirdCore
        product: PipeBirdCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.settlegrid.pipebird
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        # Capabilities for Phase D are configured in Xcode (Game Center, In-App Purchase) and require
        # an Apple Developer team — left to the human-only signing step.
schemes:
  PipeBird:
    build:
      targets:
        PipeBird: all
    run:
      config: Debug
    archive:
      config: Release
